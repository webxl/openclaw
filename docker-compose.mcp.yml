services:
  openclaw:
    build: .
    environment:
      # Single token used for both gateway auth and MCP HTTP auth.
      # Override at runtime: OPENCLAW_GATEWAY_TOKEN=secret docker compose -f docker-compose.mcp.yml up
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-changeme}
    command:
      - sh
      - -c
      - |
        node openclaw.mjs gateway run --allow-unconfigured --port 18789 --token "$$OPENCLAW_GATEWAY_TOKEN" &
        GATEWAY_PID=$$!
        # Wait for the gateway to accept connections before starting the MCP server.
        for i in $$(seq 1 30); do
          node -e "fetch('http://127.0.0.1:18789/health').then(r=>{if(!r.ok)throw r.status}).catch(()=>process.exit(1))" 2>/dev/null && break
          sleep 1
        done
        node openclaw.mjs mcp serve --port 9878 --host 0.0.0.0 &
        MCP_PID=$$!
        # Relay signals to both child processes.
        trap "kill $$GATEWAY_PID $$MCP_PID 2>/dev/null" INT TERM
        wait $$GATEWAY_PID $$MCP_PID
    ports:
      - "9878:9878"
